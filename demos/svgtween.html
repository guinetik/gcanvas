<body>
  <div id="info">
  <span class="info-eyebrow">painter</span>
  <h1>SVG Motion</h1>
  <p class="dek">An SVG path that draws itself in neon green.</p>
  <p>Two logo paths trace themselves with a glowing drawing point, then drift on a jittery float loop once complete.</p>
  <p class="notes"><strong>SVGShape</strong> animates path progress with <strong>Easing</strong>, and <strong>Motion.float</strong> handles the idle drift.</p>
  <ul class="controls">
    <li><kbd>Click</kbd> restart the animation</li>
  </ul>
</div>
  <canvas id="game"></canvas>
  <script type="module">
    import { MyGame } from './js/svgtween.js';

    window.addEventListener("load", () => {
      const canvas = document.getElementById("game");
      const game = new MyGame(canvas);
      game.start();
    });
  </script>

<body>
  <div id="info">
    <span class="info-eyebrow">game</span>
    <h1>Basic Template</h1>
    <p class="dek">A minimal Game to kickstart new demos.</p>
    <p>One game scene and one UI scene: a "Hello World" box in the center, an FPS counter in the corner.</p>
    <p class="notes">A <strong>Game</strong> runs the loop, <strong>GameObjects</strong> draw, <strong>Scenes</strong> group them, and the <strong>Pipeline</strong> orders it all every frame.</p>
  </div>
  <canvas id="game"></canvas>

  <script type="module">
    import { DemoGame } from "./js/basic.js";
    window.addEventListener("load", () => {
      const canvas = document.getElementById("game");
      const game = new DemoGame(canvas);
      //game.enableLogging();
      game.enablePauseOnBlur(true);
      game.setFPS(60);
      game.start();
    });
  </script>
</body>
